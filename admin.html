<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pedidos · La Gitanilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work, the workshop's order book
   IDEA the ledger kept at the saddlery counter: new order slip on top, the book below
   PICTURE the order list itself, with status stamps and money owed
   COLOUR black ground, gold lead, green paid, amber pending, red cancelled
   TYPE Cinzel + Alegreya Sans
   LAYOUT top bar, new-order slip (form + result), then the ledger list */
:root{color-scheme:dark;--bg:#000;--ink:#f3ead9;--soft:#bfae94;--panel:#110e0a;--line:#2e251a;--gold:#d4ad5a;--gold2:#a9822f;--wa:#25a366;--ok:#5fd394;--amb:#e7b54a;--bad:#ff8a7a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Alegreya Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(4vw,16px);border-bottom:1px solid var(--line)}
header img{width:42px;height:42px}
header h1{font-size:20px;color:var(--gold)}
main{max-width:1240px;margin:auto;padding:20px max(4vw,16px) 60px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;border:0;font-weight:800;cursor:pointer;text-decoration:none;white-space:nowrap}
.b.g{background:var(--gold);color:#1a1209}.b.w{background:var(--wa);color:#fff}.b.o{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold2)}.b.r{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px #8a3b31}
.b:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.b:disabled{opacity:.5}
.warn{display:grid;gap:8px;margin-bottom:16px}
.warn div{border:1px solid #8a6a2a;background:rgba(231,181,74,.08);color:var(--amb);border-radius:10px;padding:10px 14px;font-size:15px}
.warn div.bad{border-color:#8a3b31;background:rgba(255,138,122,.08);color:var(--bad)}
.slip{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:26px}
.slip h2{font-size:20px;color:var(--gold);grid-column:1/-1}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.full{grid-column:1/-1}
label{display:grid;gap:4px;font-weight:700;font-size:14px}
label small{font-weight:400;color:var(--soft)}
input,select,textarea{font:16px "Alegreya Sans",sans-serif;padding:9px 11px;border-radius:10px;border:2px solid var(--line);background:#000;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.spec{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr) 40px;gap:6px;margin-bottom:6px}
.x{border:1px solid var(--line);background:#000;color:var(--soft);border-radius:10px;cursor:pointer;font-size:18px;min-height:40px}
.drop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:2px dashed var(--gold2);border-radius:12px;padding:10px;background:#0b0906}
.drop.on{border-color:var(--gold)}
.drop img{width:64px;height:74px;object-fit:cover;border-radius:8px}
.drop span{font-size:14px;color:var(--soft)}
.lnk{display:inline;color:var(--gold);text-decoration:underline;cursor:pointer;font-size:14px}
.res{background:#0b0906;border:1px solid var(--gold2);border-radius:14px;padding:16px;align-self:start;position:sticky;top:12px}
.res .lab{color:var(--gold);font-weight:700}
.res .big{font-family:Cinzel,serif;font-size:clamp(26px,3vw,34px);color:#fff4dc;margin:2px 0 8px}
.res .row{display:flex;justify-content:space-between;font-size:15px;color:var(--soft)}
.res .row span:last-child{color:var(--ink);white-space:nowrap}
.linkbox{margin-top:12px;padding:10px;border-radius:10px;background:#000;border:1px solid var(--line);font-size:15px;overflow-wrap:anywhere;color:#fff4dc}
.res .acts{display:grid;gap:8px;margin-top:10px}
.st{min-height:1.4em;font-size:14px;color:var(--gold);margin-top:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar h2{font-size:22px;color:var(--gold);margin-right:auto}
.bar input{max-width:260px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--gold);color:#1a1209;border-color:var(--gold)}
.list{display:grid;gap:10px}
.o{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.o>summary{display:grid;grid-template-columns:56px minmax(0,1.6fr) minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none}
.o>summary::-webkit-details-marker{display:none}
.o>summary img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#000}
.o .n b{display:block}.o .n small{color:var(--soft)}
.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt small{display:block;color:var(--soft);font-size:13px}
.tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.t-nuevo{background:#2a2218;color:var(--soft)}.t-datos{background:rgba(231,181,74,.15);color:var(--amb)}.t-anticipo{background:rgba(95,211,148,.12);color:var(--ok)}.t-pagado{background:var(--ok);color:#06210f}.t-en_taller{background:#2c2440;color:#c9b8ff}.t-enviado{background:#173246;color:#8fd0ff}.t-entregado{background:#1f3a2a;color:var(--ok)}.t-cancelado{background:#3a1a16;color:var(--bad)}
.body{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:4px 14px 16px;border-top:1px solid var(--line)}
.body h3{font-size:15px;color:var(--gold);margin:12px 0 6px}
.body p,.body li{font-size:15px;color:var(--soft);margin:0}
.body ul{margin:0;padding-left:18px}
.body .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.empty{color:var(--soft);text-align:center;padding:40px}
.login{max-width:380px;margin:12vh auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
.login img{width:90px;margin:0 auto 10px}
.login form{display:grid;gap:10px;margin-top:14px}
.login .err{color:var(--bad);min-height:1.4em;font-size:15px}
.tabs{display:flex;gap:6px;margin-right:auto;margin-left:8px;flex-wrap:wrap}
.tab{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.tab[aria-selected=true]{background:var(--gold);color:#1a1209;border-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;color:var(--soft);font-size:14px}
.kpi b{display:block;font-family:Cinzel,serif;font-size:clamp(22px,2.6vw,30px);margin-top:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi small{color:var(--soft);font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.box h3{font-size:17px;color:var(--gold);margin-bottom:12px}
.mrow{display:grid;grid-template-columns:70px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.mrow .bars{display:grid;gap:3px}
.br{height:10px;border-radius:5px;min-width:2px}
.br.i{background:var(--ok)}.br.g{background:var(--bad)}
.mrow .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:13px;color:var(--soft);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.crow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.crow .br{height:12px;background:var(--gold2)}
.crow .v{white-space:nowrap;font-variant-numeric:tabular-nums}
.forms{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:20px}
.forms form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.forms .st{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;color:var(--soft);font-weight:500;font-size:13px;border-bottom:1px solid var(--line);padding:8px 6px}
.tbl td{border-bottom:1px solid #1f1912;padding:8px 6px;vertical-align:top}
.tbl td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.del{background:none;border:0;color:var(--soft);cursor:pointer;font-size:18px;min-width:32px;min-height:32px;padding:0 4px}
.del:hover{color:var(--bad)}
.scroll{overflow-x:auto}
.cnote{font-size:13px;color:var(--soft);margin-top:16px}
dialog.dlg{background:var(--panel);color:var(--ink);border:1px solid var(--gold2);border-radius:16px;padding:20px;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto}
dialog.dlg::backdrop{background:rgba(0,0,0,.7)}
dialog.dlg h3{color:var(--gold);font-size:19px;margin-bottom:12px}
dialog.dlg form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
dialog.dlg .w{grid-column:1/-1}
dialog.dlg .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
dialog.dlg .err{grid-column:1/-1;color:var(--bad);font-size:14px;min-height:1.2em}
.ed{background:none;border:0;color:var(--soft);cursor:pointer;font-size:16px;min-width:32px;min-height:32px;padding:0 4px}
.ed:hover{color:var(--gold)}
.mini{display:flex;align-items:center;gap:2px;font-size:14px;color:var(--soft)}
.mini span{flex:1}
.nlist{display:grid;gap:8px;margin-top:8px}
.nota{background:#0b0906;border:1px solid var(--line);border-left:3px solid var(--gold2);border-radius:10px;padding:8px 10px;font-size:15px}
.nota p{margin:0;white-space:pre-wrap;color:var(--ink)}
.nota .nm{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft);margin-top:4px}
.nota .nm span{flex:1}
.nadd{display:grid;gap:6px;margin-top:8px}
.nadd textarea{min-height:60px;resize:vertical}
@media(max-width:600px){dialog.dlg form{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cgrid,.forms{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.tbl thead{display:none}.tbl tr{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:8px 0;border-bottom:1px solid var(--line)}.tbl td{border:0;padding:2px 4px}.forms form{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.slip{grid-template-columns:minmax(0,1fr)}.res{position:static}.body{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.fg,.fg3{grid-template-columns:minmax(0,1fr)}.o>summary{grid-template-columns:48px minmax(0,1fr) auto}.o>summary .tagc,.o>summary .ci{display:none}}
</style>
</head>

 <div class="kpi"><span>Por cobrar</span><b style="color:var(--amb)">${money(pc)}</b><small>${C.porCobrar.length} ${C.porCobrar.length===1?"pedido":"pedidos"} con saldo pendiente</small></div></div>
 <div class="forms">
 <div class="box"><h3>Registrar gasto</h3><form id="fg" novalidate>
 <label for="gc" class="full" style="grid-column:1/-1">Concepto<input id="gc" placeholder="Piel de cocodrilo negro, 2 m²"></label>
 <label for="gcat">Categoría<select id="gcat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
 <label for="gm">Monto<input id="gm" inputmode="decimal" placeholder="8500"></label>
 <label for="gf">Fecha<input id="gf" type="date" value="${ymd()}"></label>
 <label for="gmet">Pagado con<select id="gmet"><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Otro</option></select></label>
 <label for="gp" style="grid-column:1/-1">Pedido <small>opcional: para saber cuánto ganas en cada montura</small><select id="gp"><option value="">General del taller</option>${orders.filter(o=>o.estado!=="cancelado").map(o=>`<option value="${o.code}">${esc(o.folio)} · ${esc(o.nombre||o.modelo)}</option>`).join("")}</select></label>
 <button class="b g" type="submit" style="grid-column:1/-1">Guardar gasto</button><p class="st" id="gst"></p></form></div>
 <div class="box"><h3>Otro ingreso</h3><p style="color:var(--soft);font-size:14px;margin:-6px 0 10px">Ventas que no son pedidos del sistema: accesorios, reparaciones, ventas en el taller. Los pagos de pedidos se suman solos.</p><form id="fi" novalidate>
 <label for="ic" style="grid-column:1/-1">Concepto<input id="ic" placeholder="Reparación de montura"></label>
 <label for="im">Monto<input id="im" inputmode="decimal" placeholder="1200"></label>
 <label for="if">Fecha<input id="if" type="date" value="${ymd()}"></label>
 <label for="imet" style="grid-column:1/-1">Cobrado con<select id="imet"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select></label>
 <button class="b g" type="submit" style="grid-column:1/-1">Guardar ingreso</button><p class="st" id="ist"></p></form></div></div>
 <div class="cgrid">
 <div class="box"><h3>Últimos 6 meses</h3><div class="legend"><span><i style="background:var(--ok)"></i>Ingresos</span><span><i style="background:var(--bad)"></i>Gastos</span></div>
 ${sm.map(x=>`<div class="mrow"><span>${yl(x.k)}</span><div class="bars"><div class="br i" style="width:${x.i/mx*100}%"></div><div class="br g" style="width:${x.g/mx*100}%"></div></div><span class="v ${x.i-x.g>=0?"pos":"neg"}">${money(x.i-x.g)}</span></div>`).join("")}</div>
 <div class="box"><h3>Gastos por categoría</h3>${cats.length?cats.map(c=>`<div class="crow"><span>${esc(c[0])}</span><div class="br" style="width:${c[1]/cm*100}%"></div><span class="v">${money(c[1])}</span></div>`).join(""):'<p style="color:var(--soft)">Sin gastos en este periodo.</p>'}</div></div>
 <div class="box"><h3>Movimientos</h3>${L.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Método</th><th style="text-align:right">Monto</th><th></th></tr></thead><tbody>
 ${L.map(m=>`<tr><td>${new Date(String(m.f).length===10?m.f+"T12:00":m.f).toLocaleDateString("es-MX")}</td><td>${esc(m.c)}</td><td>${esc(m.cat)}</td><td>${esc(m.met||"")}</td><td class="n ${m.t==="i"?"pos":"neg"}">${m.t==="i"?"+":"−"}${money(m.m)}</td><td style="white-space:nowrap">${m.del?`<button class="ed" type="button" data-edit="${m.del}" data-id="${m.id}" aria-label="Editar movimiento" title="Editar">✎</button><button class="del" type="button" data-del="${m.del}" data-id="${m.id}" aria-label="Borrar movimiento" title="Borrar">×</button>`:""}</td></tr>`).join("")}</tbody></table></div>`:'<p style="color:var(--soft)">No hay movimientos en este periodo.</p>'}</div>
 ${C.porCobrar.length?`<div class="box" style="margin-top:16px"><h3>Por cobrar</h3><div class="scroll"><table class="tbl"><thead><tr><th>Folio</th><th>Cliente</th><th>Estado</th><th style="text-align:right">Pagado</th><th style="text-align:right">Falta</th></tr></thead><tbody>${C.porCobrar.map(o=>`<tr><td>${esc(o.folio)}</td><td>${esc(o.nombre?o.nombre+" "+(o.apellido||""):o.modelo)}</td><td>${EST[o.estado]||o.estado}</td><td class="n">${money(o.pagado)}</td><td class="n" style="color:var(--amb)">${money(o.restante)}</td></tr>`).join("")}</tbody></table></div></div>`:""}
 <p class="cnote">Este es un control interno de ingresos y gastos. Para impuestos y facturación, comparte el Excel con tu contador.</p>`;
 $("per").addEventListener("change",e=>{per=e.target.value;renderConta();});
 $("fg").addEventListener("submit",async e=>{e.preventDefault();try{await api("/api/admin/gastos",{method:"POST",body:JSON.stringify({concepto:$("gc").value,categoria:$("gcat").value,monto:num($("gm").value),fecha:$("gf").value,metodo:$("gmet").value,code:$("gp").value})});await loadConta();await load();$("gst").textContent="Gasto guardado.";}catch(err){$("gst").textContent=err.message;}});
 $("fi").addEventListener("submit",async e=>{e.preventDefault();try{await api("/api/admin/otros-ingresos",{method:"POST",body:JSON.stringify({concepto:$("ic").value,monto:num($("im").value),fecha:$("if").value,metodo:$("imet").value})});await loadConta();$("ist").textContent="Ingreso guardado.";}catch(err){$("ist").textContent=err.message;}});
 $("tcon").querySelector(".tbl")?.addEventListener("click",async e=>{const ed=e.target.closest("[data-edit]");
  if(ed){const k=ed.dataset.edit,id=ed.dataset.id;let ok=false;try{
   if(k==="gastos")ok=await editGasto(C.gastos.find(x=>x.id===id));
   else if(k==="otros-ingresos")ok=await editOtro(C.otros.find(x=>x.id===id));
   else ok=await editPago(C.pagos.find(x=>x.id===id));
   if(ok){await loadConta();await load();}}catch(err){ed.textContent="!";}return;}
  const b=e.target.closest("[data-del]");if(!b)return;if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="¿Borrar?";return;}
  const u=b.dataset.del==="pago"?"/api/admin/pagos/"+b.dataset.id:"/api/admin/"+b.dataset.del+"/"+b.dataset.id;
  try{await api(u,{method:"DELETE"});await loadConta();if(b.dataset.del==="pago")await load();}catch(err){b.textContent="!";}});
}
/* ---------- cuadro de edición ---------- */
function ask(title,fields){return new Promise(res=>{const d=$("dlg");
 d.innerHTML=`<h3>${esc(title)}</h3><form method="dialog" novalidate>${fields.map(f=>`<label class="${f.w?"w":""}" for="dq_${f.k}">${esc(f.l)}${f.t==="select"?`<select id="dq_${f.k}">${f.o.map(o=>`<option ${String(o)===String(f.v)?"selected":""}>${esc(o)}</option>`).join("")}</select>`:f.t==="sel2"?`<select id="dq_${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.v??"")?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`:f.t==="area"?`<textarea id="dq_${f.k}" rows="4">${esc(f.v??"")}</textarea>`:`<input id="dq_${f.k}" ${f.t==="date"?'type="date"':""} ${f.t==="num"?'inputmode="decimal"':""} value="${esc(f.v??"")}">`}</label>`).join("")}<p class="err" id="dqe"></p><div class="acts"><button class="b o" type="button" id="dqc">Cancelar</button><button class="b g" type="submit">Guardar</button></div></form>`;
 const f=d.querySelector("form");
 const done=v=>{d.close();res(v);};
 $("dqc").onclick=()=>done(null);d.oncancel=e=>{e.preventDefault();done(null);};
 f.onsubmit=e=>{e.preventDefault();const v={};for(const x of fields){const el=$("dq_"+x.k);v[x.k]=x.t==="num"?num(el.value):el.value.trim();if(x.req&&!v[x.k]){$("dqe").textContent="Falta: "+x.l;el.focus();return;}}done(v);};
 d.showModal();const first=d.querySelector("input,select,textarea");if(first)first.focus();});}
const orderOpts=()=>[["","General del taller"],...(window.orders||[]).filter(o=>o.estado!=="cancelado").map(o=>[o.code,o.folio+" · "+(o.nombre||o.modelo)])];
async function editGasto(g){const v=await ask("Editar gasto",[{k:"concepto",l:"Concepto",v:g.concepto,w:1,req:1},{k:"categoria",l:"Categoría",t:"select",o:CATS,v:g.categoria},{k:"monto",l:"Monto",t:"num",v:g.monto,req:1},{k:"fecha",l:"Fecha",t:"date",v:String(g.fecha).slice(0,10)},{k:"metodo",l:"Pagado con",t:"select",o:["","Transferencia","Efectivo","Tarjeta","Otro"],v:g.metodo||""},{k:"code",l:"Pedido",t:"sel2",o:orderOpts(),v:g.code||"",w:1}]);
 if(!v)return false;await api("/api/admin/gastos/"+g.id,{method:"PATCH",body:JSON.stringify(v)});return true;}
async function addGasto(code){const v=await ask("Agregar costo al pedido",[{k:"concepto",l:"Concepto",w:1,req:1},{k:"categoria",l:"Categoría",t:"select",o:CATS,v:"Pieles"},{k:"monto",l:"Monto",t:"num",req:1},{k:"fecha",l:"Fecha",t:"date",v:ymd()},{k:"metodo",l:"Pagado con",t:"select",o:["Transferencia","Efectivo","Tarjeta","Otro"]}]);
 if(!v)return false;await api("/api/admin/gastos",{method:"POST",body:JSON.stringify({...v,code})});return true;}
async function editOtro(o){const v=await ask("Editar ingreso",[{k:"concepto",l:"Concepto",v:o.concepto,w:1,req:1},{k:"monto",l:"Monto",t:"num",v:o.monto,req:1},{k:"fecha",l:"Fecha",t:"date",v:String(o.fecha).slice(0,10)},{k:"metodo",l:"Cobrado con",t:"select",o:["","Efectivo","Transferencia","Tarjeta","Otro"],v:o.metodo||"",w:1}]);
 if(!v)return false;await api("/api/admin/otros-ingresos/"+o.id,{method:"PATCH",body:JSON.stringify(v)});return true;}
async function editPago(p){const v=await ask("Corregir pago",[{k:"monto",l:"Monto recibido",t:"num",v:p.monto,req:1},{k:"metodo",l:"Método",t:"select",o:["transferencia","efectivo","depósito","otro"],v:p.metodo}]);
 if(!v)return false;await api("/api/admin/pagos/"+p.id,{method:"PATCH",body:JSON.stringify(v)});return true;}
async function editPedido(o){const v=await ask("Editar pedido "+o.folio,[{k:"modelo",l:"Montura",v:o.modelo,w:1,req:1},{k:"precio",l:"Precio de la montura",t:"num",v:o.precio,req:1},{k:"envio",l:"Envío",t:"num",v:o.envio},{k:"anticipo",l:"Anticipo %",t:"num",v:o.anticipoPct},{k:"entrega",l:"Entrega estimada",v:o.entrega},{k:"nota",l:"Nota para el cliente (la ve el cliente)",v:o.nota,w:1}]);
 if(!v)return false;await api("/api/admin/pedidos/"+o.code,{method:"PATCH",body:JSON.stringify({accion:"editar",...v})});return true;}
/* ---------- notas ---------- */
const fdt=f=>new Date(f).toLocaleString("es-MX",{dateStyle:"medium",timeStyle:"short"});
const notaHtml=n=>`<div class="nota" data-nid="${n.id}"><p>${esc(n.texto)}</p><div class="nm"><span>${fdt(n.fecha)}${n.folio?" · "+esc(n.folio)+(n.nombre?" · "+esc(n.nombre):""):""}</span><button class="ed" type="button" data-nact="edit" aria-label="Editar nota" title="Editar">✎</button><button class="del" type="button" data-nact="del" aria-label="Borrar nota" title="Borrar">×</button></div></div>`;
let NOTAS=[];
async function noteAction(e,after){const b=e.target.closest("[data-nact]");if(!b)return false;const id=b.closest("[data-nid]").dataset.nid;
 if(b.dataset.nact==="del"){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="¿Borrar?";return true;}await api("/api/admin/notas/"+id,{method:"DELETE"});}
 else{const t=b.closest(".nota").querySelector("p").textContent;const v=await ask("Editar nota",[{k:"texto",l:"Nota",t:"area",v:t,w:1,req:1}]);if(!v)return true;await api("/api/admin/notas/"+id,{method:"PATCH",body:JSON.stringify(v)});}
 await after();return true;}
async function loadNotas(){const t=$("tnot");
 try{NOTAS=await api("/api/admin/notas");}catch(e){t.innerHTML=`<p class="empty">${esc(e.message)}</p>`;return;}
 t.innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px"><h2 style="font-size:22px;color:var(--gold);margin-right:auto">Notas internas</h2><input id="nq" type="search" placeholder="Buscar en notas…" aria-label="Buscar en notas" style="max-width:260px"></div>
 <p style="color:var(--soft);font-size:14px;margin:-4px 0 12px">Solo ustedes las ven. Las notas de cada pedido también aparecen aquí.</p>
 <form class="box nadd" id="nf2"><label for="nt">Nueva nota<textarea id="nt" placeholder="Pendiente: pedir 3 m² de avestruz rojo al proveedor…"></textarea></label>
 <label for="nc">Relacionar con un pedido <small>opcional</small><select id="nc">${orderOpts().map(o=>`<option value="${esc(o[0])}">${esc(o[0]?o[1]:"Nota general")}</option>`).join("")}</select></label>
 <button class="b g" type="submit" style="justify-self:start">Guardar nota</button><p class="st" id="nst2"></p></form>
 <div class="nlist" id="nl"></div>`;
 const draw=()=>{const q=($("nq").value||"").toLowerCase();const L=NOTAS.filter(n=>!q||[n.texto,n.folio,n.nombre].join(" ").toLowerCase().includes(q));$("nl").innerHTML=L.length?L.map(notaHtml).join(""):'<p class="empty">No hay notas todavía.</p>';};
 draw();$("nq").addEventListener("input",draw);
 $("nf2").addEventListener("submit",async e=>{e.preventDefault();try{await api("/api/admin/notas",{method:"POST",body:JSON.stringify({texto:$("nt").value,code:$("nc").value})});$("nt").value="";await loadNotas();load();}catch(err){$("nst2").textContent=err.message;}});
 $("nl").addEventListener("click",async e=>{try{await noteAction(e,async()=>{await loadNotas();load();});}catch(err){}});
}
function openRow(code){const d=document.querySelector(`[data-c="${code}"]`);if(d)d.open=true;}
fetch("/api/admin/estado",{credentials:"same-origin"}).then(r=>r.ok?boot():showLogin()).catch(showLogin);
}
</script>
</body>
</html>
