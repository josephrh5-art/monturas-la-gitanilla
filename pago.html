<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagar pedido · La Gitanilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work, trusted checkout for a premium saddlery
   IDEA the workshop's order ticket: black leather, gold stamped figures
   PICTURE the customer's own saddle model beside its spec list
   COLOUR black ground, gold lead, parchment text, green for pay
   TYPE Cinzel + Alegreya Sans
   LAYOUT order left, payment column right (sticky); stacks on phone */
:root{color-scheme:dark;--bg:#000;--ink:#f3ead9;--soft:#bfae94;--panel:#110e0a;--line:#2e251a;--gold:#d4ad5a;--gold2:#a9822f;--wa:#25a366;--wad:#1c7f4f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Alegreya Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:700;line-height:1.1;margin:0}
a{color:inherit}
header{border-bottom:1px solid var(--line);padding:10px max(5vw,16px)}
header .w{display:flex;align-items:center;gap:12px;max-width:1100px;margin:auto}
header img{width:46px;height:46px}
header b{font-family:Cinzel,serif;color:var(--gold);font-size:19px;margin-right:auto}
.secure{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:14px}
main{max-width:1100px;margin:auto;padding:clamp(20px,4vw,44px) max(5vw,16px) 60px}
.top{margin-bottom:22px}
.top h1{font-size:clamp(28px,4vw,40px);color:#fff4dc}
.top p{color:var(--soft);margin-top:6px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h2{font-size:19px;color:var(--gold);margin-bottom:14px}
.prod{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px}
.prod img{width:150px;aspect-ratio:6/7;object-fit:cover;object-position:center top;border-radius:12px;background:#000;border:1px solid var(--line)}
.prod h3{font-size:20px;color:#fff4dc}
.folio{display:inline-block;margin-top:6px;font-size:14px;color:var(--gold);border:1px solid var(--gold2);border-radius:999px;padding:2px 10px}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:14px 0 0;font-size:15px}
dt{color:var(--soft)}
dd{margin:0}
.cli{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;color:var(--soft)}
.cli b{color:var(--ink)}
.sum{display:grid;gap:8px;font-size:16px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.sum .tot{border-top:1px solid var(--line);padding-top:10px;font-weight:700}
.sum .now{background:rgba(212,173,90,.1);border:1px solid var(--gold2);border-radius:12px;padding:12px 14px;margin-top:6px;align-items:baseline}
.sum .now span:first-child{color:var(--gold);font-weight:700}
.sum .now span:last-child{font-family:Cinzel,serif;font-size:clamp(24px,3vw,30px);color:#fff4dc}
.note{font-size:14px;color:var(--soft);margin-top:8px}
.pay{position:sticky;top:16px}
.methods{display:grid;gap:10px;margin:16px 0}
.m{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .2s}
.m:hover{border-color:var(--gold2)}
.m:has(input:checked){border-color:var(--gold);background:rgba(212,173,90,.06)}
.m input{width:20px;height:20px;margin:2px 0 0;accent-color:#d4ad5a}
.m b{display:block}
.m small{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.logos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.logos span{font-size:12px;font-weight:800;letter-spacing:.02em;padding:2px 8px;border-radius:6px;background:#f3ead9;color:#1a1209}
.bank{display:none;margin-top:10px;font-size:15px;background:#0b0906;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.m:has(input:checked) .bank{display:block}
.bank div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:4px 0}
.bank code{font-size:15px;color:#fff4dc;overflow-wrap:anywhere}
.cp{min-height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--gold2);background:transparent;color:var(--gold);cursor:pointer;font:600 14px "Alegreya Sans",sans-serif}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--soft);margin:8px 0 14px}
.chk input{width:20px;height:20px;accent-color:#d4ad5a;margin-top:2px;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;border:0;font:800 18px "Alegreya Sans",sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,opacity .2s}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,.m:focus-within,.cp:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.pay-b{background:var(--wa);color:#fff}
.btn.pay-b:hover{background:var(--wad)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold);margin-top:10px;min-height:48px;font-size:16px}
.trust{display:grid;gap:6px;margin-top:14px;font-size:14px;color:var(--soft)}
.trust div{display:flex;gap:8px;align-items:flex-start}
.trust svg{flex:none;margin-top:2px}
.msg{min-height:1.4em;font-size:15px;color:var(--gold);margin-top:8px;text-align:center}
.empty{max-width:560px;margin:10vh auto;text-align:center}
.empty img{width:110px;margin:0 auto 16px}
.empty p{color:var(--soft);margin:10px 0 20px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}.pay{position:static}}
@media(max-width:480px){.prod{grid-template-columns:minmax(0,1fr)}.prod img{width:100%;max-width:260px}}
</style>
</head>

${specs.length?`<dl>${specs.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>`:""}</div></div>
<div class="cli"><b>${esc(d.cn||"")}</b>${d.ci?` · Envío a ${esc(d.ci)}`:""}${d.te?`<br>Entrega estimada: ${esc(d.te)}`:""}</div>
</section>
<aside class="card pay" aria-labelledby="t2"><h2 id="t2">Resumen de pago</h2>
<div class="sum">
<div><span>Montura</span><span>${money(d.pr)}</span></div>
${+d.en?`<div><span>Envío</span><span>${money(d.en)}</span></div>`:""}
<div class="tot"><span>Total del pedido</span><span>${money(total)}</span></div>
${d.an?`<div><span>Anticipo (${esc(d.an)}%)</span><span>${money(now)}</span></div><div><span>Restante al entregar</span><span>${money(total-now)}</span></div>`:""}
<div class="now"><span>A pagar hoy</span><span>${money(now)}</span></div>
</div>
${methods.length?`<div class="methods" role="radiogroup" aria-label="Forma de pago">${methods.map((x,i)=>`<label class="m"><input type="radio" name="pm" value="${x.id}" ${i?"":"checked"}><span><b>${x.t}</b><small>${x.s}</small><span class="logos">${x.l.map(l=>`<span>${l}</span>`).join("")}</span>
${x.bank?`<span class="bank"><div><span>Banco</span><code>${esc(d.bk)}</code></div><div><span>Titular</span><code>${esc(d.ti)}</code></div><div><span>CLABE</span><code id="clabe">${esc(d.cl)}</code><button class="cp" type="button" id="cpc">Copiar</button></div><div><span>Concepto</span><code>${esc(d.fo||"Pedido")}</code></div></span>`:""}</span></label>`).join("")}</div>`:`<p class="note">Este pedido todavía no tiene forma de pago. Escríbenos por WhatsApp.</p>`}
<label class="chk"><input type="checkbox" id="ok"><span>Revisé mi pedido y los datos son correctos. Entiendo que mi montura se hace a mano sobre pedido.</span></label>
<a class="btn pay-b" id="payb" href="#" aria-disabled="true">Pagar ${money(now)}</a>
<a class="btn ghost" id="proof" href="${wa(`Hola, soy ${d.cn||""}. Ya hice el pago de mi pedido${d.fo?" folio "+d.fo:""} por ${money(now)}. Te mando mi comprobante.`)}">Ya pagué · enviar comprobante</a>
<p class="msg" id="msg" aria-live="polite"></p>
<div class="trust">
<div><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#d4ad5a" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z"/></svg><span>Los datos de tu tarjeta los captura ${link?provider(link):"el procesador de pagos"} en su página segura. La Gitanilla nunca los ve ni los guarda.</span></div>
<div><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#d4ad5a" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg><span>¿Dudas? <a href="${wa("Hola, tengo una duda sobre mi pedido"+(d.fo?" folio "+d.fo:"")+".")}">Escríbenos por WhatsApp</a> al 479 221 0090.</span></div>
</div>
</aside></div>`;
const ok=$("#ok"),payb=$("#payb"),msg=$("#msg");
const sel=()=>{const r=document.querySelector('input[name=pm]:checked');return r?r.value:null;};
const upd=()=>{const s=sel();const can=ok.checked&&s;payb.setAttribute("aria-disabled",String(!can));
if(s==="spei"){payb.textContent="Ya transferí · enviar comprobante";payb.href=$("#proof").href;payb.removeAttribute("target");}
else if(link){payb.textContent=(s==="oxxo"?"Generar referencia de pago · ":"Pagar ")+money(now);payb.href=link;payb.target="_blank";payb.rel="noopener";}
msg.textContent=ok.checked?"":"Marca la casilla para continuar.";};
ok.addEventListener("change",upd);
for(const r of document.querySelectorAll('input[name=pm]'))r.addEventListener("change",upd);
payb.addEventListener("click",()=>{if(sel()!=="spei")setTimeout(()=>{msg.textContent="Cuando termines de pagar, envíanos tu comprobante para confirmar tu pedido.";},400);});
const cpc=$("#cpc");if(cpc)cpc.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(d.cl);cpc.textContent="Copiada";}catch(e){cpc.textContent="Selecciónala";}});
upd();
}
}
</script>
</body>
</html>
