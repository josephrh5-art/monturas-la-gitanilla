<style>
/* VOICE work, trusted checkout for a premium saddlery
   IDEA the workshop's order ticket: black leather, gold stamped figures
   PICTURE the customer's own saddle beside its spec list
   COLOUR black ground, gold lead, parchment text, green for pay
   TYPE Cinzel + Alegreya Sans
   LAYOUT order + summary on top, shipping form below; one column on phone */
:root{color-scheme:dark;--bg:#000;--ink:#f3ead9;--soft:#bfae94;--panel:#110e0a;--line:#2e251a;--gold:#d4ad5a;--gold2:#a9822f;--wa:#25a366;--wad:#1c7f4f;--bad:#ff8a7a;--ok:#5fd394}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Alegreya Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:700;line-height:1.1;margin:0}
a{color:inherit}
header{border-bottom:1px solid var(--line);padding:10px max(5vw,16px)}
header .w{display:flex;align-items:center;gap:12px;max-width:1100px;margin:auto}
header img{width:46px;height:46px}
header b{font-family:Cinzel,serif;color:var(--gold);font-size:19px;margin-right:auto}
.secure{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:14px}
main{max-width:1100px;margin:auto;padding:clamp(20px,4vw,40px) max(5vw,16px) 60px}
.top{margin-bottom:20px}
.top h1{font-size:clamp(28px,4vw,40px);color:#fff4dc}
.top p{color:var(--soft);margin:6px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h2{font-size:19px;color:var(--gold);margin-bottom:14px}
.prod{display:grid;grid-template-columns:160px minmax(0,1fr);gap:18px}
.prod img{width:160px;aspect-ratio:6/7;object-fit:cover;object-position:center top;border-radius:12px;background:#000;border:1px solid var(--line)}
.prod h3{font-size:20px;color:#fff4dc}
.folio{display:inline-block;margin-top:6px;font-size:14px;color:var(--gold);border:1px solid var(--gold2);border-radius:999px;padding:2px 10px}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:14px 0 0;font-size:15px}
dt{color:var(--soft)}dd{margin:0}
.meta{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:var(--soft)}
.sum{display:grid;gap:8px;font-size:16px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.sum .tot{border-top:1px solid var(--line);padding-top:10px;font-weight:700}
.now{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:rgba(212,173,90,.1);border:1px solid var(--gold2);border-radius:12px;padding:12px 14px;margin-top:10px}
.now span:first-child{color:var(--gold);font-weight:700}
.now{flex-wrap:wrap}
.now span:last-child{font-family:Cinzel,serif;font-size:clamp(22px,2.4vw,28px);color:#fff4dc;white-space:nowrap;margin-left:auto}
.status{border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:16px;border:1px solid}
.status.ok{border-color:#2f7d55;background:rgba(95,211,148,.08);color:var(--ok)}
.status.wait{border-color:var(--gold2);background:rgba(212,173,90,.08);color:var(--gold)}
.status.bad{border-color:#8a3b31;background:rgba(255,138,122,.08);color:var(--bad)}
form .card{margin-top:22px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.full{grid-column:1/-1}
label{display:grid;gap:4px;font-weight:700;font-size:15px}
label .req{color:var(--gold)}
label small{font-weight:400;color:var(--soft)}
input,select,textarea{font:16px "Alegreya Sans",sans-serif;padding:11px 12px;border-radius:10px;border:2px solid var(--line);background:#000;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:76px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.err input,.err select,.err textarea{border-color:var(--bad)}
.emsg{color:var(--bad);font-size:14px;font-weight:500;min-height:0}
.methods{display:grid;gap:10px;margin:16px 0}
.m{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font-weight:400}
.m:has(input:checked){border-color:var(--gold);background:rgba(212,173,90,.06)}
.m input{width:20px;height:20px;margin:2px 0 0;accent-color:#d4ad5a;padding:0}
.m b{display:block}
.m small{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--soft);font-weight:400;margin:6px 0 14px}
.chk input{width:20px;height:20px;accent-color:#d4ad5a;margin-top:2px;flex:none;padding:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;border:0;font:800 18px "Alegreya Sans",sans-serif;cursor:pointer;text-decoration:none}
.btn:focus-visible,.m:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.btn.pay{background:var(--wa);color:#fff}
.btn.pay:hover{background:var(--wad)}
.btn.pay:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold);margin-top:10px;min-height:48px;font-size:16px}
.bank{background:#0b0906;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.bank div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.bank code{color:#fff4dc;font-size:15px;overflow-wrap:anywhere}
.cp{min-height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--gold2);background:transparent;color:var(--gold);cursor:pointer;font:600 14px "Alegreya Sans",sans-serif}
.trust{display:grid;gap:6px;margin-top:14px;font-size:14px;color:var(--soft)}
.msg{min-height:1.4em;font-size:15px;color:var(--bad);margin-top:8px;text-align:center}
.addr{font-size:15px;color:var(--soft);line-height:1.5}
.addr b{color:var(--ink)}
.center{max-width:560px;margin:10vh auto;text-align:center}
.center img{width:110px;margin:0 auto 16px}
.center p{color:var(--soft);margin:10px 0 20px}
.skel{height:300px;border-radius:16px;background:linear-gradient(90deg,#0f0c09,#1b1510,#0f0c09);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){.fg{grid-template-columns:minmax(0,1fr)}.prod{grid-template-columns:minmax(0,1fr)}.prod img{width:100%;max-width:280px}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2})+" MXN";
const code=(location.pathname.match(/\/p\/([A-Z0-9]{6,12})/)||[])[1];
const qs=new URLSearchParams(location.search);
const app=$("#app");
const FIELDS=[
["nombre","Nombre",1,"given-name","",""],["apellido","Apellidos",1,"family-name","",""],
["telefono","Teléfono (WhatsApp)",1,"tel","tel","10 dígitos"],["email","Correo",0,"email","email","opcional, para tu recibo"],
["calle","Calle y número",1,"address-line1","","full"],["colonia","Colonia",1,"address-level3","",""],
["cp","Código postal",1,"postal-code","numeric","5 dígitos"],["ciudad","Ciudad o municipio",1,"address-level2","",""],
["estado","Estado",1,"address-level1","",""],["pais","País",1,"country-name","",""],
["referencias","Referencias",1,"","","full"]];
const wa=(n,m)=>"https://wa.me/"+n+"?text="+encodeURIComponent(m);
async function load(){
 if(!code){app.innerHTML=`<div class="center"><img src="${LOGO}" alt=""><h1>Link incompleto</h1><p>Revisa el link que te mandamos por WhatsApp.</p></div>`;return;}
 const u="/api/pedido/"+code+(qs.get("payment_id")?"?payment_id="+encodeURIComponent(qs.get("payment_id")):"");
 let d;try{const r=await fetch(u);d=await r.json();if(!r.ok)throw new Error(d.error);}catch(e){app.innerHTML=`<div class="center"><img src="${LOGO}" alt=""><h1>No encontramos tu pedido</h1><p>${esc(e.message||"Intenta de nuevo en un momento.")}</p></div>`;return;}
 render(d);
}
function statusBox(d){
 const st=qs.get("status")||qs.get("collection_status");
 if(d.estado==="cancelado")return `<div class="status bad">Este pedido fue cancelado. Si es un error, escríbenos por WhatsApp.</div>`;
 if(d.estado==="pagado"||d.estado==="enviado"||d.estado==="entregado"||(d.pagado>0&&d.restante<0.01))return `<div class="status ok">¡Pago completo recibido! Gracias. ${d.estado==="enviado"?"Tu montura ya va en camino.":d.estado==="entregado"?"Tu montura fue entregada.":"Te avisaremos cuando tu montura esté lista."}</div>`;
 if(d.pagado>0)return `<div class="status ok">Recibimos tu anticipo de ${money(d.pagado)}. Ya empezamos a trabajar tu montura. ${d.due>0?"Ya puedes pagar el restante.":"El restante se paga al entregar."}</div>`;
 if(st==="pending"||st==="in_process")return `<div class="status wait">Tu pago está en proceso. Si pagaste en OXXO o en efectivo, se confirma cuando la tienda lo reporte (puede tardar algunas horas).</div>`;
 if(st==="rejected"||st==="failure")return `<div class="status bad">El pago no se pudo completar. Puedes intentar de nuevo con otra tarjeta o forma de pago.</div>`;
 return "";
}
function render(d){
 const c=d.cliente||{};
 const foto=d.foto?"/api/pedido/"+d.code+"/foto":LOGO;
 const canPay=d.due>0.009;
 const methods=[];
 if(d.pagoTarjeta)methods.push(["mp","Tarjeta, OXXO o saldo Mercado Pago","Se abre la página segura de Mercado Pago. Puedes pagar con tarjeta de crédito o débito, en efectivo en OXXO o con tu cuenta."]);
 if(d.banco)methods.push(["transferencia","Transferencia bancaria (SPEI)","Te mostramos nuestros datos bancarios para que transfieras desde tu banco."]);
 app.innerHTML=`<div class="top"><h1>${c.nombre?"Hola, "+esc(c.nombre)+". ":""}Tu pedido</h1><p>${canPay&&!d.cliente?"Revisa tu montura, llena tus datos de envío y paga de forma segura.":"Aquí puedes ver el estado de tu pedido."}</p></div>
 ${statusBox(d)}
 <div class="grid">
 <section class="card" aria-labelledby="t1"><h2 id="t1">Tu montura</h2>
 <div class="prod"><img src="${foto}" alt="${esc(d.modelo)}"><div><h3>${esc(d.modelo)}</h3><span class="folio">Folio ${esc(d.folio)}</span>
 ${d.specs.length?`<dl>${d.specs.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>`:""}</div></div>
 ${d.entrega||d.nota?`<div class="meta">${d.entrega?`Entrega estimada: <b>${esc(d.entrega)}</b>`:""}${d.nota?`<br>${esc(d.nota)}`:""}</div>`:""}
 ${d.cliente?`<div class="meta addr"><b>Envío a:</b><br>${esc(c.nombre)} ${esc(c.apellido)} · ${esc(c.telefono)}<br>${esc(c.calle)}, Col. ${esc(c.colonia)}, C.P. ${esc(c.cp)}<br>${esc(c.ciudad)}, ${esc(c.estado)}, ${esc(c.pais)}<br>Referencias: ${esc(c.referencias)}</div>`:""}
 </section>
 <aside class="card" aria-labelledby="t2"><h2 id="t2">Resumen de pago</h2>
 <div class="sum">
 <div><span>Montura</span><span>${money(d.precio)}</span></div>${d.envio>0?`<div><span>Envío</span><span>${money(d.envio)}</span></div>`:""}
 <div class="tot"><span>Total del pedido</span><span>${money(d.total)}</span></div>
 ${d.anticipoPct>0&&d.anticipoPct<100?`<div><span>Anticipo (${d.anticipoPct}%)</span><span>${money(d.anticipo)}</span></div>`:""}
 ${d.pagado>0?`<div><span>Pagado</span><span style="color:var(--ok)">${money(d.pagado)}</span></div><div><span>Restante</span><span>${money(d.restante)}</span></div>`:""}
 </div>
 ${canPay?`<div class="now"><span>${d.pagado>0?"Restante a pagar":"A pagar hoy"}</span><span>${money(d.due)}</span></div>`:""}
 <div class="trust">${d.pagoTarjeta?"<span>Los datos de tu tarjeta los captura Mercado Pago en su página segura. La Gitanilla nunca los ve ni los guarda.</span>":""}<span>¿Dudas? <a href="${wa(d.whatsapp,"Hola, tengo una duda sobre mi pedido folio "+d.folio)}">Escríbenos por WhatsApp</a>.</span></div>
 </aside></div>
 ${canPay?`<form id="f" novalidate><section class="card" aria-labelledby="t3"><h2 id="t3">${d.cliente?"Confirma tus datos de envío":"Tus datos de envío"}</h2>
 <p style="color:var(--soft);margin:-6px 0 14px;font-size:15px">Los campos con <span style="color:var(--gold)">*</span> son obligatorios.</p>
 <div class="fg">${FIELDS.map(([k,l,r,ac,im,h])=>{const full=h==="full"||k==="referencias";const v=c[k]??(k==="pais"?"México":"");
  const inp=k==="referencias"?`<textarea id="${k}" name="${k}" ${r?"required":""} placeholder="Entre qué calles, color de la casa, portón…">${esc(v)}</textarea>`:`<input id="${k}" name="${k}" value="${esc(v)}" ${ac?`autocomplete="${ac}"`:""} ${im?`inputmode="${im}"`:""} ${k==="email"?'type="email"':""} ${r?"required":""} ${k==="cp"?'maxlength="5"':""}>`;
  return `<label class="${full?"full":""}" for="${k}" data-f="${k}"><span>${l}${r?' <span class="req">*</span>':""}${h&&h!=="full"?` <small>${h}</small>`:""}</span>${inp}<span class="emsg" id="e_${k}"></span></label>`;}).join("")}</div>
 ${methods.length?`<h2 style="margin-top:22px">Forma de pago</h2><div class="methods" role="radiogroup" aria-label="Forma de pago">${methods.map((m,i)=>`<label class="m"><input type="radio" name="metodo" value="${m[0]}" ${i?"":"checked"}><span><b>${m[1]}</b><small>${m[2]}</small></span></label>`).join("")}</div>`:`<p class="status wait" style="margin-top:16px">Por ahora el pago en línea no está disponible. Guarda tus datos y te contactamos por WhatsApp para el pago.</p>`}
 <label class="chk"><input type="checkbox" id="ok"><span>Revisé mi pedido y mis datos. Entiendo que mi montura se hace a mano sobre pedido.</span></label>
 <span class="emsg" id="e_ok"></span>
 <button class="btn pay" id="go" type="submit">${methods.length?(methods[0][0]==="mp"?"Continuar al pago · "+money(d.due):"Ver datos para transferir"):"Guardar mis datos"}</button>
 <p class="msg" id="msg" aria-live="polite"></p>
 <div id="bankbox"></div>
 </section></form>`:""}`;
 if(!canPay)return;
 const f=$("#f"),go=$("#go"),msg=$("#msg");
 const upBtn=()=>{const m=(f.querySelector("input[name=metodo]:checked")||{}).value;go.textContent=m==="transferencia"?"Ver datos para transferir":m==="mp"?"Continuar al pago · "+money(d.due):"Guardar mis datos";};
 f.addEventListener("change",e=>{if(e.target.name==="metodo")upBtn();});
 f.addEventListener("input",e=>{if(e.target.id==="ok")$("#e_ok").textContent="";const l=e.target.closest("[data-f]");if(l){l.classList.remove("err");$("#e_"+l.dataset.f).textContent="";}});
 const showErr=(k,t)=>{const l=f.querySelector(`[data-f="${k}"]`);if(l){l.classList.add("err");$("#e_"+k).textContent=t;}};
 f.addEventListener("submit",async e=>{
  e.preventDefault();msg.textContent="";$("#e_ok").textContent="";
  const v={};let first=null;
  for(const [k,l,r] of FIELDS){v[k]=f.elements[k].value.trim();if(r&&!v[k]){showErr(k,"Este campo es obligatorio.");first=first||k;}}
  if(v.telefono&&v.telefono.replace(/\D/g,"").length<10){showErr("telefono","Escribe tu número a 10 dígitos.");first=first||"telefono";}
  if(v.cp&&!/^\d{5}$/.test(v.cp)){showErr("cp","El código postal debe tener 5 dígitos.");first=first||"cp";}
  if(v.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)){showErr("email","Revisa tu correo.");first=first||"email";}
  if(!$("#ok").checked){$("#e_ok").textContent="Marca la casilla para continuar.";first=first||"ok";}
  if(first){(f.elements[first]||$("#ok")).focus();msg.textContent="Revisa los campos marcados.";return;}
  v.metodo=(f.querySelector("input[name=metodo]:checked")||{}).value||"";
  go.disabled=true;const old=go.textContent;go.textContent="Guardando…";
  try{
   const r=await fetch("/api/pedido/"+code+"/pagar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
   const j=await r.json();
   if(!r.ok){if(j.campo)showErr(j.campo,j.error);throw new Error(j.error);}
   if(j.redirect){go.textContent="Abriendo Mercado Pago…";location.href=j.redirect;return;}
   if(j.transferencia&&d.banco){go.textContent="Datos guardados ✓";
    $("#bankbox").innerHTML=`<div class="bank"><div><span>Banco</span><code>${esc(d.banco.banco)}</code></div><div><span>Titular</span><code>${esc(d.banco.titular)}</code></div><div><span>CLABE</span><code>${esc(d.banco.clabe)}</code><button class="cp" type="button" id="cpc">Copiar</button></div><div><span>Monto</span><code>${money(d.due)}</code></div><div><span>Concepto</span><code>${esc(d.folio)}</code></div></div>
    <a class="btn ghost" href="${wa(d.whatsapp,`Hola, soy ${v.nombre} ${v.apellido}. Ya transferí ${money(d.due)} de mi pedido folio ${d.folio}. Te mando mi comprobante.`)}">Ya transferí · enviar comprobante</a>`;
    $("#cpc").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(d.banco.clabe);$("#cpc").textContent="Copiada";}catch(e){$("#cpc").textContent="Selecciónala";}});
    return;}
   go.textContent="Datos guardados ✓";msg.style.color="var(--ok)";msg.textContent="¡Listo! Te contactaremos por WhatsApp para el pago.";
  }catch(err){go.disabled=false;go.textContent=old;msg.textContent=err.message||"No se pudo guardar. Intenta de nuevo.";}
 });
}
load();
}
</script>
</body>
</html>
